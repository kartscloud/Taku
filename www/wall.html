<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>taku · device wall</title>
<style>
  :root{
    --bg:#0a0810; --panel:#15111f; --line:#2a2338; --txt:#efeaf8; --dim:#8b83a1;
    --accent:#a982f5;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans)}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px 18px;background:rgba(10,8,16,.94);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  .brand{font-weight:800;letter-spacing:-.02em}
  .brand i{color:var(--accent);font-style:normal}
  label{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--dim);margin-right:7px}
  select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;font-size:12.5px;font-family:inherit;cursor:pointer}
  select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button:hover{border-color:var(--accent)}
  .grow{flex:1}
  .hint{font-family:var(--mono);font-size:11px;color:var(--dim)}

  .wall{display:flex;flex-wrap:wrap;gap:30px;padding:30px 22px 60px;align-items:flex-start;justify-content:center}
  .dev{display:flex;flex-direction:column;align-items:center;gap:9px}
  .devname{font-size:12.5px;font-weight:700;letter-spacing:-.01em;text-align:center}
  .devsize{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.05em}
  .devtag{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 8px}

  /* the phone body scales as a whole so the screen keeps its true logical size */
  .shell{position:relative;background:#171522;border-radius:var(--r);
    box-shadow:0 22px 60px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.07);
    transform-origin:top center}
  .shell.android{background:#14161c}
  .screen{position:relative;overflow:hidden;border-radius:calc(var(--r) - 10px);background:#000}
  .screen iframe{border:0;display:block;width:100%;height:100%}
  .island{position:absolute;left:50%;transform:translateX(-50%);background:#000;z-index:3;
    border-radius:999px;pointer-events:none}
  .punch{position:absolute;background:#000;border-radius:50%;z-index:3;pointer-events:none}
  .homebar{position:absolute;left:50%;transform:translateX(-50%);bottom:7px;width:36%;height:5px;
    border-radius:3px;background:rgba(255,255,255,.5);z-index:3;pointer-events:none}
  .navbar3{position:absolute;left:0;right:0;bottom:0;height:22px;z-index:3;pointer-events:none;
    display:flex;align-items:center;justify-content:center;gap:44px}
  .navbar3 i{width:11px;height:11px;border:1.5px solid rgba(255,255,255,.45);border-radius:2px}
  .navbar3 i:first-child{border-radius:50%}
  .safe .screen::before,.safe .screen::after{content:"";position:absolute;left:0;right:0;z-index:2;
    background:rgba(168,85,247,.16);pointer-events:none}
  .safe .screen::before{top:0;height:var(--sat)}
  .safe .screen::after{bottom:0;height:var(--sab)}
  footer{padding:0 22px 40px;text-align:center;color:var(--dim);font-size:12px;line-height:1.6}
</style>
</head>
<body>

<header>
  <span class="brand">taku <i>·</i> device wall</span>
  <div><label for="view">Screen</label>
    <select id="view">
      <option value="deck">Swipe</option>
      <option value="browse">Discover</option>
      <option value="watched">Tiers</option>
      <option value="profile">Profile</option>
    </select>
  </div>
  <div><label for="zoom">Zoom</label>
    <select id="zoom">
      <option value=".38">38%</option>
      <option value=".46">46%</option>
      <option value=".58">58%</option>
      <option value=".75" selected>75%</option>
      <option value="1">100%</option>
    </select>
  </div>
  <div><label for="kind">Device</label>
    <select id="kind"></select>
  </div>
  <button id="safe">Safe areas</button>
  <button id="reload">Reload all</button>
  <span class="grow"></span>
  <span class="hint" id="count"></span>
</header>

<div class="wall" id="wall"></div>

<footer>
  Every screen renders at the device's true logical size with real
  <b>env(safe-area-inset-*)</b> values injected, then the whole phone is scaled down to fit.
  Chromium, not WebKit — so this catches layout, not Safari-specific rendering.
</footer>

<script>
/* Logical sizes in CSS px and the safe-area insets iOS/Android actually report.
   The insets are the point of this page: they are 0 in a plain desktop iframe,
   so a layout that depends on env() looks fine here and wrong on a phone. */
const DEVICES=[
  {id:"se3",   os:"ios", name:"iPhone SE (3rd gen)", w:375,h:667, sat:20,sab:0,  r:26, top:"none"},
  {id:"mini",  os:"ios", name:"iPhone 13 mini",      w:375,h:812, sat:50,sab:34, r:44, top:"notch", nw:162,nh:32},
  {id:"14",    os:"ios", name:"iPhone 14",           w:390,h:844, sat:47,sab:34, r:47, top:"notch", nw:162,nh:32},
  {id:"15pro", os:"ios", name:"iPhone 15 Pro",       w:393,h:852, sat:59,sab:34, r:55, top:"island",nw:125,nh:37},
  {id:"16pro", os:"ios", name:"iPhone 16 Pro",       w:402,h:874, sat:62,sab:34, r:55, top:"island",nw:125,nh:37},
  {id:"16pm",  os:"ios", name:"iPhone 16 Pro Max",   w:440,h:956, sat:62,sab:34, r:55, top:"island",nw:125,nh:37},
  {id:"17pm",  os:"ios", name:"iPhone 17 Pro Max",   w:440,h:956, sat:62,sab:34, r:55, top:"island",nw:125,nh:37},
  // Android: a centre punch-hole, a shorter status bar, and either a gesture
  // pill or the older three-button bar, which eats noticeably more height.
  {id:"px8",   os:"android", name:"Pixel 8",          w:412,h:915, sat:24,sab:24, r:38, top:"punch", pd:26},
  {id:"px8p",  os:"android", name:"Pixel 8 Pro",      w:448,h:992, sat:24,sab:24, r:40, top:"punch", pd:26},
  {id:"s24",   os:"android", name:"Galaxy S24",       w:360,h:780, sat:24,sab:24, r:34, top:"punch", pd:22},
  {id:"s24u",  os:"android", name:"Galaxy S24 Ultra", w:384,h:824, sat:24,sab:24, r:22, top:"punch", pd:22},
  {id:"a54",   os:"android", name:"Galaxy A54 (3-button)", w:360,h:800, sat:24,sab:48, r:30, top:"punch", pd:22, nav3:true},
];

const $=s=>document.querySelector(s);
const wall=$("#wall");
let zoom=.75, kind="15pro", safe=false, view="deck";

/* One device at a time by default — twelve live iframes is a wall of noise when
   you are actually trying to look at something. The comparison views stay
   available for when seeing them together IS the point. */
(function fillDevicePicker(){
  const k=$("#kind");
  const groups=[["Compare",[["all","All phones"],["ios","All iPhones"],["android","All Android"]]],
                ["iPhone",DEVICES.filter(d=>d.os==="ios").map(d=>[d.id,d.name])],
                ["Android",DEVICES.filter(d=>d.os==="android").map(d=>[d.id,d.name])]];
  k.innerHTML=groups.map(([label,items])=>
    `<optgroup label="${label}">`+items.map(([v,n])=>
      `<option value="${v}"${v===kind?" selected":""}>${n}</option>`).join("")+`</optgroup>`).join("");
})();

function build(){
  wall.innerHTML="";
  const list=DEVICES.filter(d=>
    kind==="all" ? true
    : (kind==="ios"||kind==="android") ? d.os===kind
    : d.id===kind);
  list.forEach(d=>{
    const cell=document.createElement("div");
    cell.className="dev";
    const bezel=d.os==="android"?12:13;
    const shellW=d.w+bezel*2, shellH=d.h+bezel*2;
    cell.style.width=(shellW*zoom)+"px";
    cell.innerHTML=`
      <div class="shell ${d.os}${safe?" safe":""}" style="--r:${d.r}px;--sat:${d.sat}px;--sab:${d.sab}px;
           width:${shellW}px;height:${shellH}px;padding:${bezel}px;
           transform:scale(${zoom});margin-bottom:${-(shellH*(1-zoom))}px">
        <div class="screen" style="width:${d.w}px;height:${d.h}px">
          <iframe title="${d.name}" src="index.html" loading="lazy"></iframe>
        </div>
        ${d.top==="island"||d.top==="notch"
          ? `<div class="island" style="top:${bezel+(d.top==="island"?11:0)}px;width:${d.nw}px;height:${d.nh}px;
               border-radius:${d.top==="island"?"999px":"0 0 18px 18px"}"></div>` : ""}
        ${d.top==="punch"
          ? `<div class="punch" style="top:${bezel+9}px;left:50%;margin-left:${-d.pd/2}px;
               width:${d.pd}px;height:${d.pd}px"></div>` : ""}
        ${d.nav3
          ? `<div class="navbar3" style="bottom:${bezel}px"><i></i><i></i><i></i></div>`
          : (d.sab>0?`<div class="homebar" style="bottom:${bezel+7}px"></div>`:"")}
      </div>
      <div class="devname">${d.name}</div>
      <div class="devsize">${d.w} × ${d.h} pt · safe ${d.sat}/${d.sab}</div>
      <div class="devtag">${d.os==="ios"?"iOS":"Android"}</div>`;
    wall.appendChild(cell);
    const fr=cell.querySelector("iframe");
    fr.addEventListener("load",()=>inject(fr,d));
  });
  $("#count").textContent=list.length+" devices";
}

/* env(safe-area-inset-*) resolves to 0 inside a desktop iframe, so a phone
   layout that relies on it would look deceptively correct here. Inject the real
   values as the CSS variables the app already reads, then put it on the
   requested screen. */
function inject(fr,d){
  try{
    const doc=fr.contentDocument, win=fr.contentWindow;
    const st=doc.createElement("style");
    st.textContent=`:root{--sat:${d.sat}px !important;--sab:${d.sab}px !important;}`;
    doc.head.appendChild(st);
    if(typeof win.setView==="function")win.setView(view);
  }catch(e){/* not ready yet; the next reload will catch it */}
}
function applyView(){
  wall.querySelectorAll("iframe").forEach(fr=>{
    try{const w=fr.contentWindow;if(typeof w.setView==="function")w.setView(view);}catch(e){}
  });
}

/* Browsers restore <select> state across reloads, which silently desynced the
   controls from these variables — the page came back showing iPhones only while
   the dropdown still read "All phones". Adopt whatever the controls actually
   say at startup rather than assuming the markup defaults survived. */
(function adoptControlState(){
  const z=$("#zoom"),k=$("#kind"),v=$("#view");
  if(z&&z.value)zoom=+z.value;
  if(k&&k.value)kind=k.value;
  if(v&&v.value)view=v.value;
})();

$("#zoom").onchange=e=>{zoom=+e.target.value;build();};
$("#kind").onchange=e=>{kind=e.target.value;build();};
$("#view").onchange=e=>{view=e.target.value;applyView();};
$("#safe").onclick=()=>{safe=!safe;$("#safe").style.borderColor=safe?"var(--accent)":"";build();};
$("#reload").onclick=()=>build();
build();
</script>
</body>
</html>
