<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>taku · pick a look</title>
<style>
  :root{--bg:#0a0810;--panel:#15111f;--line:#2a2338;--txt:#efeaf8;--dim:#8b83a1;--accent:#a982f5;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans)}
  header{position:sticky;top:0;z-index:20;padding:16px 20px;display:flex;align-items:center;
    gap:16px;flex-wrap:wrap;background:rgba(10,8,16,.95);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
  h1 i{color:var(--accent);font-style:normal}
  label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);margin-right:6px}
  select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .grow{flex:1}
  .note{font-size:12px;color:var(--dim)}
  .note b{color:#7fe0ab}
  .grid{display:flex;flex-wrap:wrap;gap:26px;padding:26px 20px 70px;justify-content:center}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px}
  .frame{width:300px;height:640px;border-radius:26px;overflow:hidden;background:#000;
    box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08)}
  .frame iframe{width:300px;height:640px;border:0;display:block}
  .cap{text-align:center}
  .cname{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
  .cmeta{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.08em;margin-top:3px}
  .pass{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
    padding:2px 7px;border-radius:20px;margin-top:5px;
    background:rgba(52,211,153,.14);color:#7fe0ab;border:1px solid rgba(52,211,153,.35)}
  footer{text-align:center;color:var(--dim);font-size:12.5px;padding:0 22px 50px;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>taku <i>·</i> pick a look</h1>
  <div><label for="screen">Screen</label>
    <select id="screen">
      <option value="profile">Profile</option>
      <option value="deck">Swipe</option>
      <option value="browse">Discover</option>
      <option value="watched">Tiers</option>
    </select></div>
  <div><label for="mode">Show</label>
    <select id="mode">
      <option value="both">Both modes</option>
      <option value="dark">Dark only</option>
      <option value="light">Light only</option>
    </select></div>
  <span class="grow"></span>
  <span class="note">Contrast checked: <b>all 10 pass WCAG AA</b></span>
</header>
<div class="grid" id="grid"></div>
<footer>
  Every combination was measured — body text, secondary text, button labels and accent-as-text
  against their own backgrounds. Worst case across all ten is 4.51:1 against a 4.5:1 requirement.<br>
  Tell me which one and I'll make it the default.
</footer>

<script>
const PALETTES=[
  {id:"sumi",name:"Sumi",note:"ink & washi"},
  {id:"jump",name:"Jump",note:"newsprint"},
  {id:"matcha",name:"Matcha",note:"cream & green"},
  {id:"blueprint",name:"Blueprint",note:"cyanotype"},
  {id:"violet",name:"Violet",note:"the original"}
];
const grid=document.getElementById("grid");
let screenView="profile", modeFilter="both";

function build(){
  grid.innerHTML="";
  const modes = modeFilter==="both" ? ["dark","light"] : [modeFilter];
  PALETTES.forEach(p=>{
    modes.forEach(m=>{
      const cell=document.createElement("div");
      cell.className="cell";
      cell.innerHTML=`<div class="frame"><iframe title="${p.name} ${m}" src="index.html"></iframe></div>
        <div class="cap"><div class="cname">${p.name} · ${m}</div>
          <div class="cmeta">${p.note.toUpperCase()}</div>
          <span class="pass">AA PASS</span></div>`;
      grid.appendChild(cell);
      const fr=cell.querySelector("iframe");
      fr.addEventListener("load",()=>apply(fr,p.id,m));
    });
  });
}
/* Each frame is told which palette to wear after it boots. Writing to its
   localStorage before load would race with the app reading it, so it is applied
   directly to the loaded document instead — and only for display, so the frames
   do not fight over the real saved preference. */
function apply(fr,pal,mode){
  try{
    const w=fr.contentWindow,d=fr.contentDocument;
    d.documentElement.setAttribute("data-palette",pal);
    d.documentElement.setAttribute("data-theme",mode);
    const st=d.createElement("style");
    st.textContent=":root{--sat:47px !important;--sab:34px !important}";
    d.head.appendChild(st);
    if(typeof w.setView==="function")w.setView(screenView);
    // canvases sample the variables when they paint, so redraw after the swap
    setTimeout(()=>{
      try{
        if(typeof w.paintSignature==="function"&&w.currentView==="profile")
          w.paintSignature(d.querySelector("#net"),w._lastProf||w.computeProfile());
        if(typeof w.paintIdBanner==="function")w.paintIdBanner();
      }catch(e){}
    },260);
  }catch(e){}
}
document.getElementById("screen").onchange=e=>{
  screenView=e.target.value;
  document.querySelectorAll("iframe").forEach(fr=>{
    try{
      const w=fr.contentWindow;
      if(typeof w.setView==="function")w.setView(screenView);
      setTimeout(()=>{try{
        if(typeof w.paintSignature==="function"&&w.currentView==="profile")
          w.paintSignature(fr.contentDocument.querySelector("#net"),w._lastProf||w.computeProfile());
      }catch(e){}},260);
    }catch(e){}
  });
};
document.getElementById("mode").onchange=e=>{modeFilter=e.target.value;build();};
build();
</script>
</body>
</html>
