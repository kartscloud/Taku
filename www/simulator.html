<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>taku · iPhone harness</title>
<style>
  :root{
    --chrome:#1a1a1f; --chrome2:#3a3a42; --stage:#0a0a0d;
    --panel:#141419; --line:#2a2a33; --txt:#e8e8ef; --dim:#8b8b9c; --accent:#8b5cf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--stage);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* ---- toolbar ---- */
  .bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  .bar .ttl{font-weight:700;font-size:13px;letter-spacing:-.2px}
  .bar .ttl b{background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .grp{display:flex;align-items:center;gap:6px}
  .grp label{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  select,.tbtn{background:#1e1e26;border:1px solid var(--line);color:var(--txt);font-size:12px;
    font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer;outline:none;font-family:inherit}
  select:hover,.tbtn:hover{border-color:#41414f}
  .tbtn:active{transform:scale(.96)}
  .tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .spacer{flex:1}
  .dims{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}

  /* ---- stage ---- */
  .stage{flex:1;display:grid;place-items:center;overflow:auto;padding:26px}
  .wrap{transform-origin:center center}

  /* ---- device chassis ---- */
  .phone{position:relative;background:linear-gradient(145deg,#4a4a55,#22222a 40%,#3d3d47);
    padding:11px;box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07);}
  .phone .screen{position:relative;overflow:hidden;background:#000}
  .phone iframe{display:block;border:0;width:100%;height:100%;background:#0d0b14}

  /* side buttons */
  .btn-sw,.btn-vu,.btn-vd,.btn-pw{position:absolute;background:linear-gradient(90deg,#2c2c34,#4a4a55);
    border-radius:2px}
  .btn-sw{left:-2px;width:3px;height:28px;top:96px}
  .btn-vu{left:-2px;width:3px;height:56px;top:140px}
  .btn-vd{left:-2px;width:3px;height:56px;top:208px}
  .btn-pw{right:-2px;width:3px;height:86px;top:170px}

  /* dynamic island / notch */
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);background:#000;
    border-radius:20px;z-index:6;pointer-events:none}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#000;
    border-radius:0 0 20px 20px;z-index:6;pointer-events:none}

  /* status bar overlay */
  .sbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;
    justify-content:space-between;color:#fff;pointer-events:none;
    font:600 15px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
  .sbar .t{font-weight:700;letter-spacing:-.3px}
  .sbar .r{display:flex;align-items:center;gap:5px}
  .sbar svg{display:block}

  /* home indicator */
  .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;
    border-radius:3px;background:rgba(255,255,255,.55);z-index:7;pointer-events:none}
  /* home button (SE) */
  .homebtn{position:absolute;bottom:-64px;left:50%;transform:translateX(-50%);width:46px;height:46px;
    border-radius:50%;border:1.5px solid #4a4a55;background:linear-gradient(145deg,#33333c,#22222a)}

  .hint{padding:7px 16px;background:var(--panel);border-top:1px solid var(--line);
    font-size:11px;color:var(--dim);flex:none;text-align:center}
  .hint b{color:#c9c9d8}
</style>
</head>
<body>

<div class="bar">
  <span class="ttl"><b>taku</b> · device harness</span>
  <div class="grp">
    <label for="dev">Device</label>
    <select id="dev"></select>
  </div>
  <div class="grp">
    <label for="scl">Zoom</label>
    <select id="scl">
      <option value="auto">Fit</option>
      <option value="1">100%</option>
      <option value="0.85">85%</option>
      <option value="0.75">75%</option>
      <option value="0.6">60%</option>
    </select>
  </div>
  <button class="tbtn" id="safe">Safe areas</button>
  <button class="tbtn" id="reload">Reload</button>
  <span class="spacer"></span>
  <span class="dims" id="dims"></span>
</div>

<div class="stage">
  <div class="wrap" id="wrap">
    <div class="phone" id="phone">
      <span class="btn-sw"></span><span class="btn-vu"></span>
      <span class="btn-vd"></span><span class="btn-pw"></span>
      <div class="screen" id="screen">
        <iframe id="app" src="index.html" title="taku"></iframe>
        <div class="sbar" id="sbar">
          <span class="t" id="clock">9:41</span>
          <span class="r">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 11.5 5.8 9.1a3.1 3.1 0 0 1 4.4 0L8 11.5Zm-4.3-4.7a7.4 7.4 0 0 1 8.6 0l-1.4 1.5a5.4 5.4 0 0 0-5.8 0L3.7 6.8ZM.9 3.9a11.4 11.4 0 0 1 14.2 0l-1.4 1.5a9.4 9.4 0 0 0-11.4 0L.9 3.9Z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.6" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="19" height="9" rx="2.2" fill="#fff"/><path d="M24.5 4.2v4.6a2.5 2.5 0 0 0 0-4.6Z" fill="#fff" fill-opacity=".5"/></svg>
          </span>
        </div>
        <div class="island" id="island"></div>
        <div class="homebar" id="homebar"></div>
      </div>
      <div class="homebtn" id="homebtn" style="display:none"></div>
    </div>
  </div>
</div>

<div class="hint" id="hint"></div>

<script>
/* Logical viewport + real Safari safe-area insets per device.
   These are the values iOS actually reports to env(safe-area-inset-*). */
const DEVICES=[
  {id:"se3",   name:"iPhone SE (3rd gen)", w:375, h:667, sat:20, sab:0,  r:4,  top:"none"},
  {id:"mini",  name:"iPhone 13 mini",      w:375, h:812, sat:50, sab:34, r:44, top:"notch", nw:162,nh:32},
  {id:"14",    name:"iPhone 14",           w:390, h:844, sat:47, sab:34, r:47, top:"notch", nw:162,nh:32},
  {id:"15pro", name:"iPhone 15 Pro",       w:393, h:852, sat:59, sab:34, r:55, top:"island",nw:125,nh:37},
  // 16 Pro onward the Dynamic Island sits slightly lower: 62pt top inset, not 59
  {id:"16pro", name:"iPhone 16 Pro",       w:402, h:874, sat:62, sab:34, r:55, top:"island",nw:125,nh:37},
  {id:"16pm",  name:"iPhone 16 Pro Max",   w:440, h:956, sat:62, sab:34, r:55, top:"island",nw:125,nh:37},
  {id:"17pm",  name:"iPhone 17 Pro Max",   w:440, h:956, sat:62, sab:34, r:55, top:"island",nw:125,nh:37},
];

const $=s=>document.querySelector(s);
const sel=$("#dev"), scl=$("#scl"), phone=$("#phone"), screen=$("#screen"),
      frame=$("#app"), island=$("#island"), homebar=$("#homebar"), homebtn=$("#homebtn"),
      sbar=$("#sbar"), wrap=$("#wrap");
let cur=DEVICES.find(d=>d.id==="15pro"), showSafe=false;

DEVICES.forEach(d=>{
  const o=document.createElement("option");
  o.value=d.id;o.textContent=d.name;if(d.id===cur.id)o.selected=true;sel.appendChild(o);
});

function applyDevice(){
  const d=cur;
  screen.style.width=d.w+"px";
  screen.style.height=d.h+"px";
  screen.style.borderRadius=d.r+"px";
  phone.style.borderRadius=(d.r+11)+"px";

  // notch / island
  island.className=d.top==="island"?"island":d.top==="notch"?"notch":"";
  if(d.top==="none"){island.style.display="none";}
  else{
    island.style.display="block";
    island.style.width=d.nw+"px";island.style.height=d.nh+"px";
    if(d.top==="notch"){island.style.top="0";island.style.borderRadius="0 0 20px 20px";}
    else{island.style.top="11px";island.style.borderRadius="20px";}
  }

  homebar.style.display=d.sab?"block":"none";
  homebtn.style.display=d.sab?"none":"block";

  // status bar sits inside the top inset
  sbar.style.height=(d.sat||20)+"px";
  sbar.style.padding=d.top==="none"?"0 12px":"0 "+(d.top==="island"?30:28)+"px";
  sbar.style.paddingTop=d.top==="none"?"0":"12px";
  sbar.style.alignItems=d.top==="none"?"center":"center";

  $("#dims").textContent=d.w+" x "+d.h+" pt  ·  safe-area "+d.sat+"/"+d.sab;
  $("#hint").innerHTML="Rendering at the device's true logical size with real <b>env(safe-area-inset)</b> values injected — "+
    "content must clear <b>"+d.sat+"px</b> at the top and <b>"+d.sab+"px</b> at the bottom. "+
    "Not an iOS Simulator: this is Chromium, not WebKit.";

  injectSafeArea();
  fit();
}

/* env() resolves to 0 inside a desktop iframe, so push the real insets in as
   variable overrides. Same-origin, so this is allowed. */
function injectSafeArea(){
  const doc=frame.contentDocument;
  if(!doc||!doc.documentElement)return;
  let st=doc.getElementById("__safearea");
  if(!st){st=doc.createElement("style");st.id="__safearea";doc.head&&doc.head.appendChild(st);}
  st.textContent=`:root{--sat:${cur.sat}px !important;--sab:${cur.sab}px !important}
    /* iOS has no visible scrollbar gutter — hide Chromium's so widths match the device */
    html{scrollbar-width:none}::-webkit-scrollbar{width:0;height:0;display:none}`+
    (showSafe?`
      body::before{content:"";position:fixed;top:0;left:0;right:0;height:${cur.sat}px;
        background:rgba(236,72,153,.28);border-bottom:1px dashed rgba(236,72,153,.9);z-index:99999;pointer-events:none}
      body::after{content:"";position:fixed;bottom:0;left:0;right:0;height:${cur.sab}px;
        background:rgba(236,72,153,.28);border-top:1px dashed rgba(236,72,153,.9);z-index:99999;pointer-events:none}`:"");
}

function fit(){
  const v=scl.value;
  let k=1;
  if(v==="auto"){
    const availH=window.innerHeight-160, availW=window.innerWidth-80;
    k=Math.min(availH/(cur.h+22), availW/(cur.w+22), 1);
  } else k=parseFloat(v);
  wrap.style.transform="scale("+k+")";
  // reserve real layout space so the stage scrolls correctly when zoomed in
  wrap.style.width=(cur.w+22)+"px";
  wrap.style.height=(cur.h+22)+"px";
  wrap.style.margin=(((cur.h+22)*(k-1))/2)+"px "+(((cur.w+22)*(k-1))/2)+"px";
}

function tick(){
  const n=new Date();
  let h=n.getHours(),m=String(n.getMinutes()).padStart(2,"0");
  h=h%12||12;
  $("#clock").textContent=h+":"+m;
}

sel.onchange=()=>{cur=DEVICES.find(d=>d.id===sel.value);applyDevice();};
scl.onchange=fit;
$("#reload").onclick=()=>{frame.contentWindow.location.reload();};
$("#safe").onclick=e=>{showSafe=!showSafe;e.target.classList.toggle("on",showSafe);injectSafeArea();};
frame.addEventListener("load",()=>{injectSafeArea();fit();});
window.addEventListener("resize",()=>{if(scl.value==="auto")fit();});
/* fit() ran once at load, so if the window settled or was resized afterwards
   the phone kept a stale scale and rendered tiny / off-centre. A `resize` event
   isn't guaranteed for every case (embedded panes, late layout), so watch the
   stage box directly and re-fit whenever it actually changes. */
if(window.ResizeObserver){
  let last="";
  new ResizeObserver(()=>{
    const s=$(".stage").getBoundingClientRect();
    const k=Math.round(s.width)+"x"+Math.round(s.height);
    if(k!==last){last=k;if(scl.value==="auto")fit();}
  }).observe($(".stage"));
}
// belt and braces: one late re-fit after first paint settles
requestAnimationFrame(()=>setTimeout(fit,120));

applyDevice();tick();setInterval(tick,10000);
</script>
</body>
</html>
