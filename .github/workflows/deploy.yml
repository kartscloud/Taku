name: Deploy taku to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # Development harnesses live in www/ so the dev server can load them beside
      # index.html, but they are tooling, not product. Deleting them from the
      # runner's throwaway checkout keeps them out of the published site without
      # changing anything locally.
      - name: Strip dev-only pages
        run: rm -f www/wall.html www/themes.html www/simulator.html

      - name: Upload www/ as the site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
